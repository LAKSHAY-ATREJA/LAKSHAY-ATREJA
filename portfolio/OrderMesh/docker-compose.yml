services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: ordermesh, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","0.0.0.0:9092","--advertise-kafka-addr","redpanda:9092"]
    ports: ["9092:9092"]
  api:
    build: .
    environment: {DB_URL: "jdbc:postgresql://postgres:5432/ordermesh", KAFKA_BOOTSTRAP: "redpanda:9092"}
    depends_on: [postgres, redpanda]
    ports: ["8080:8080"]
