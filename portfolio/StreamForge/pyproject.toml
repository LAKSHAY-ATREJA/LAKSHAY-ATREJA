[project]
name="streamforge"
version="1.0.0"
description="Real-time event processor with deduplication, event-time windows and anomaly detection"
authors=[{name="Lakshay Atreja"}]
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30", "aiokafka>=0.11"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath=["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamforge*"]
