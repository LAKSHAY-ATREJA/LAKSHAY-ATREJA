services:
  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","0.0.0.0:9092","--advertise-kafka-addr","redpanda:9092"]
    ports: ["9092:9092"]
  api:
    build: .
    command: ["uvicorn","streamforge.api:app","--host","0.0.0.0","--port","8000"]
    ports: ["8000:8000"]
  worker:
    build: .
    command: ["python","-m","streamforge.consumer"]
    environment: {KAFKA_BOOTSTRAP: "redpanda:9092", KAFKA_TOPIC: "telemetry.events"}
    depends_on: [redpanda]
