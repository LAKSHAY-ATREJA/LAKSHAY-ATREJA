[project]
name="ragguard"
version="1.0.0"
description="Offline-first RAG reference gateway with retrieval, guardrails and evaluation"
authors=[{name="Lakshay Atreja"}]
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.8", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath=["."]

[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragguard*"]
