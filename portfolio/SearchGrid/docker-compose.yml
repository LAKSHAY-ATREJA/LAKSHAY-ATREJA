services:
  api:
    build: .
    ports:
      - "8000:8000"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: searchgrid
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d searchgrid"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
