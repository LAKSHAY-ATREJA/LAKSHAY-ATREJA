name: LedgerFlow CI
on:
  push:
    paths:
      - "portfolio/LedgerFlow/**"
  pull_request:
    paths:
      - "portfolio/LedgerFlow/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/LedgerFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio/LedgerFlow/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
