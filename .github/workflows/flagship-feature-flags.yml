name: Flagship Feature Flags CI

on:
  push:
    paths:
      - "portfolio/Flagship-Feature-Flags/**"
      - ".github/workflows/flagship-feature-flags.yml"
  pull_request:
    paths:
      - "portfolio/Flagship-Feature-Flags/**"
      - ".github/workflows/flagship-feature-flags.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/Flagship-Feature-Flags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: portfolio/Flagship-Feature-Flags/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build server
        run: go build -buildvcs=false ./cmd/server
      - name: End-to-end demo
        run: ./demo.sh
