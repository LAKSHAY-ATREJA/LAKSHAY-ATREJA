name: LedgerFlow checks

on:
  push:
    paths:
      - 'portfolio/LedgerFlow/**'
      - '.github/workflows/ledgerflow.yml'
  pull_request:
    paths:
      - 'portfolio/LedgerFlow/**'
      - '.github/workflows/ledgerflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: portfolio/LedgerFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python demo.py
