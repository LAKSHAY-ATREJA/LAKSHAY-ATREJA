name: Portfolio prototypes
on:
  push:
    paths:
      - 'projects/SignalScope/**'
      - 'projects/VisionDelta/**'
      - '.github/workflows/portfolio-prototypes.yml'
  pull_request:
    paths:
      - 'projects/SignalScope/**'
      - 'projects/VisionDelta/**'
      - '.github/workflows/portfolio-prototypes.yml'

jobs:
  legacy-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node projects/SignalScope/tests.mjs
      - run: node projects/VisionDelta/tests.mjs

  streamlit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [SignalScope, VisionDelta]
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r "projects/$PROJECT/requirements.txt"
      - name: Validate Python syntax
        run: python -m compileall -q "projects/$PROJECT"
      - name: Execute engine tests
        run: python -m unittest discover -s "projects/$PROJECT" -p 'test_*.py' -v
      - name: Launch Streamlit in headless test mode
        run: |
          python - <<'PY'
          import os
          import sys
          from streamlit.testing.v1 import AppTest
          project = os.environ["PROJECT"]
          sys.path.insert(0, os.path.abspath(f"projects/{project}"))
          app = AppTest.from_file(f"projects/{project}/app.py", default_timeout=120).run()
          if app.exception:
              for err in app.exception:
                  print(str(err.message))
              raise RuntimeError(f"{project} failed Streamlit app smoke test")
          print(f"{project} initial Streamlit demo rendered without an exception")
          PY
